[project]
name = "regulatory-affairs-kg"
version = "0.1.0"
description = "Regulatory Affairs knowledge graph built on Samyama — regulations, authorities, submissions, approvals"
requires-python = ">=3.10"
dependencies = [
    "samyama>=0.6.0",
    "requests>=2.31",
    "rich>=13.0",
    "click>=8.0",
    "fastmcp>=0.1.0",
    # Declared directly, not leaned on as a fastmcp transitive: mcp_server/
    # queries.py imports it for the `Limit` annotation, and queries.py is the
    # half of the server that must import without fastmcp installed.
    "pydantic>=2.0",
]

[project.optional-dependencies]
dev = ["pytest>=7.0", "ruff>=0.1.0"]

[tool.setuptools.packages.find]
include = ["etl*", "mcp_server*"]

[tool.pytest.ini_options]
markers = [
    # A test that pins a limitation the loader works around. It is EXPECTED to
    # fail when the engine gains the ability, and its docstring names the
    # workaround to drop. Marked so that failure cannot be read as a defect in
    # this repo, and so `pytest -m "not engine_limitation"` runs clean on any
    # build — which matters because two builds reporting the same version
    # answer the same query differently (DATASET-CARD issue 11).
    "engine_limitation: expected to fail when the engine gains the ability it pins",
]
testpaths = ["tests"]
# No serialisation marker: engine fixture keys carry a per-run suffix, so
# concurrent runs cannot collide and teardown cannot cross-delete. An
# xdist_group marker was tried first and would have been misleading —
# pytest-xdist is not a dependency, and the default --dist load ignores
# groups anyway, so it looked like a guard while guarding nothing.
