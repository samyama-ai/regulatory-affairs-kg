[project]
name = "regulatory-affairs-kg"
version = "0.1.0"
description = "Regulatory Affairs knowledge graph built on Samyama — regulations, authorities, submissions, approvals"
requires-python = ">=3.10"
dependencies = [
    "samyama>=0.6.0",
    "requests>=2.31",
    "rich>=13.0",
    "click>=8.0",
    "fastmcp>=0.1.0",
]

[project.optional-dependencies]
dev = ["pytest>=7.0", "ruff>=0.1.0"]

[tool.setuptools.packages.find]
include = ["etl*", "mcp_server*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
    # The engine has no tenant isolation — /api/query ignores the `graph`
    # field — so every engine-backed test writes into one shared store and
    # tears down by key. Running them concurrently would let one test's
    # teardown delete rows another is still asserting on. Declared serial
    # rather than worked around, because the constraint is the engine's.
    "xdist_group: run these together, in one worker, in order",
]
